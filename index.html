<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="estilos/mobile.css"> 

    <script src="https://kit.fontawesome.com/ac94ddbe6b.js" crossorigin="anonymous"></script>
</head>
<body>


    <section id="calculadora">
        
        <div id="visor">
            <span id="resultado">
                
            </span>
        </div>

        <div class="teclado">
                <div id="outros">
                    <span class="icone">
                        <button type="button" id="apagar">
                            <i class="fa-solid fa-delete-left" ></i>
                        </button>
                    </span>
                    <button type="button" id="deletar">E</button>
                    <button type="button" id="igual">=</button>
                </div>

                <div class="numeros">
                    <button type="button">7</button>
                    <button type="button">8</button>
                    <button type="button">9</button>
                    <button type="button">4</button>
                    <button type="button">5</button>
                    <button type="button">6</button>
                    <button type="button">1</button>
                    <button type="button">2</button>
                    <button type="button">3</button>
                    <button type="button">0</button>
                    <button type="button">.</button>
                </div>

                <div id="operacoes">
                    <button type="button" id="multi">*</button>
                    <button type="button" id="divisao">/</button>
                    <button type="button" id="menos">-</button>
                    <button type="button" id="mais">+</button>
              
                </div>
            </div>

    </section>






    <script src="comandos/scripts.js"></script>
</body>
</html>
